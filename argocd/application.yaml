apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contract-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/2303A51763/contract-system.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: contracts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true